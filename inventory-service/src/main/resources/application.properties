spring.application.name=inventory-service
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=none
server.port=8083
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Tells Hibernate to use the exact names from your Java code
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=inventory-service
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.zipkin.tracing.enabled=true
management.observations.http.server.requests.enabled=true
spring.cloud.gateway.webmvc.observability.enabled=true
management.zipkin.tracing.endpoint=http://host.docker.internal:9411/api/v2/spans

# Loki URL
loki.url=http://localhost:3100/loki/api/v1/push

